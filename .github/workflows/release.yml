name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: mach-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_RUST: 1.90.0

jobs:
  verify:
    name: verify tag and release contract
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.90.0
          command-arguments: --hide-inclusion-graph

      - name: Install Rust ${{ env.RELEASE_RUST }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          components: rustfmt, clippy

      - name: Verify tag, version, and main ancestry
        id: release_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -er '.packages | map(select(.name == "mach-tui")) | if length == 1 then .[0].version else error("expected exactly one mach-tui package") end'
          )"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          latest_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          case "$latest_tag" in
            v*) published_version=${latest_tag#v} ;;
            *)
              printf 'latest GitHub release has an invalid tag: %s\n' \
                "$latest_tag" >&2
              exit 1
              ;;
          esac
          scripts/verify-release.sh newer "$version" "$published_version"
          scripts/verify-release.sh notes \
            ".github/release-notes/v${version}.md" \
            "$version" \
            "$published_version"

      - name: Verify source contract
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --locked
          cargo package --locked
          cargo build --release --locked

      - name: Verify TUI end-to-end
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          scripts/e2e-tui.sh target/release/mach

      - name: Verify shell contracts
        env:
          TEST_SHELL: dash
        run: |
          shellcheck install.sh scripts/*.sh
          scripts/test-install.sh
          scripts/test-release.sh

  build-linux:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    container:
      image: almalinux:8-minimal@sha256:4178368be5c3b49bd1c5708e3a217e837eefa6576226524fe11ae98cb0004846
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Install build tools
        run: |
          microdnf install -y bash binutils ca-certificates curl gcc gcc-c++ git jq make pkgconf-pkg-config tar xz
          microdnf clean all

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RELEASE_RUST }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}

      - name: Build and smoke-test compatible binary
        run: |
          SOURCE_DATE_EPOCH="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mach" "dist/mach-${{ matrix.target }}"
          chmod 755 "dist/mach-${{ matrix.target }}"
          version="${{ needs.verify.outputs.version }}"
          scripts/smoke-release.sh "dist/mach-${{ matrix.target }}" "${{ matrix.target }}" "$version" 2.28

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mach-${{ matrix.target }}
          path: dist/mach-${{ matrix.target }}
          if-no-files-found: error

  build-macos:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: "10.12"
          - os: macos-15
            target: aarch64-apple-darwin
            deployment_target: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RELEASE_RUST }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}

      - name: Build and smoke-test compatible binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mach" "dist/mach-${{ matrix.target }}"
          chmod 755 "dist/mach-${{ matrix.target }}"
          version="${{ needs.verify.outputs.version }}"
          scripts/smoke-release.sh "dist/mach-${{ matrix.target }}" "${{ matrix.target }}" "$version" "${{ matrix.deployment_target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mach-${{ matrix.target }}
          path: dist/mach-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: publish checksum-verified release
    needs: [verify, build-linux, build-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # This name is part of the crates.io trusted-publisher identity.
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      NOTES_FILE: .github/release-notes/v${{ needs.verify.outputs.version }}.md
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RELEASE_RUST }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RELEASE_RUST }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: raw-dist
          merge-multiple: true

      - name: Package and verify release archives
        run: |
          version="${{ needs.verify.outputs.version }}"
          scripts/package-release.sh "$version" raw-dist dist
          scripts/verify-release.sh local dist "$version"

      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/mach-v${{ needs.verify.outputs.version }}-checksums.txt

      # v0.8.0 and older clients require the raw names to reach this archive-aware bridge.
      - name: Attest legacy bridge binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Stage or resume the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          published_release=false
          if release_json="$(gh release view "$TAG_NAME" \
            --json databaseId,isDraft,isPrerelease 2>/dev/null)"; then
            if [ "$(jq -r '.isPrerelease' <<< "$release_json")" != false ]; then
              printf 'release %s is unexpectedly marked as a prerelease\n' \
                "$TAG_NAME" >&2
              exit 1
            fi
            if [ "$(jq -r '.isDraft' <<< "$release_json")" = true ]; then
              gh release edit "$TAG_NAME" \
                --draft \
                --notes-file "$NOTES_FILE" \
                --title "mach $TAG_NAME"
            else
              published_release=true
            fi
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --fail-on-no-commits \
              --draft \
              --notes-file "$NOTES_FILE" \
              --title "mach $TAG_NAME"
          fi

          release_id="$(gh release view "$TAG_NAME" \
            --json databaseId \
            --jq '.databaseId')"
          case "$release_id" in
            '' | *[!0-9]*)
              printf 'GitHub did not return a numeric release ID: %s\n' \
                "$release_id" >&2
              exit 1
              ;;
          esac

          if [ "$published_release" = false ]; then
            gh release upload "$TAG_NAME" \
              --clobber \
              dist/mach-x86_64-unknown-linux-gnu.tar.gz \
              dist/mach-aarch64-unknown-linux-gnu.tar.gz \
              dist/mach-x86_64-apple-darwin.tar.gz \
              dist/mach-aarch64-apple-darwin.tar.gz \
              dist/mach-x86_64-unknown-linux-gnu \
              dist/mach-aarch64-unknown-linux-gnu \
              dist/mach-x86_64-apple-darwin \
              dist/mach-aarch64-apple-darwin \
              "dist/mach-v${{ needs.verify.outputs.version }}-checksums.txt" \
              dist/SHA256SUMS
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/release.json"
          if [ "$published_release" = true ]; then
            scripts/verify-release.sh github-published \
              dist "$RUNNER_TEMP/release.json" "$NOTES_FILE" \
              "${{ needs.verify.outputs.version }}"
          else
            scripts/verify-release.sh github \
              dist "$RUNNER_TEMP/release.json" "$NOTES_FILE" \
              "${{ needs.verify.outputs.version }}"
          fi
          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Prepare the crate release
        id: crate
        run: |
          version="${{ needs.verify.outputs.version }}"
          cargo package --locked
          crate_path="target/package/mach-tui-${version}.crate"
          test -f "$crate_path"

          crate_index_json="$RUNNER_TEMP/crate-index.json"
          index_http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --user-agent 'mach-release (https://github.com/Q1CHENL/mach)' \
            --output "$crate_index_json" \
            --write-out '%{http_code}' \
            'https://crates.io/api/v1/crates/mach-tui')"
          if [ "$index_http_code" != 200 ]; then
            printf 'crates.io package lookup returned HTTP %s\n' \
              "$index_http_code" >&2
            cat "$crate_index_json" >&2
            exit 1
          fi
          published_version="$(jq -er '.crate.max_version' "$crate_index_json")"
          if [ "$published_version" != "$version" ]; then
            scripts/verify-release.sh newer "$version" "$published_version"
          fi

          crate_json="$RUNNER_TEMP/crate-version.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --user-agent 'mach-release (https://github.com/Q1CHENL/mach)' \
            --output "$crate_json" \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/mach-tui/${version}")"
          case "$http_code" in
            200)
              scripts/verify-release.sh crate "$crate_path" "$version" "$crate_json"
              needs_publish=false
              ;;
            404)
              needs_publish=true
              ;;
            *)
              printf 'crates.io version lookup returned HTTP %s\n' \
                "$http_code" >&2
              cat "$crate_json" >&2
              exit 1
              ;;
          esac
          {
            printf 'version=%s\n' "$version"
            printf 'archive=%s\n' "$crate_path"
            printf 'needs_publish=%s\n' "$needs_publish"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io
        if: steps.crate.outputs.needs_publish == 'true'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: steps.crate.outputs.needs_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked

      - name: Verify the crates.io release
        env:
          CRATE_ARCHIVE: ${{ steps.crate.outputs.archive }}
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          crate_json="$RUNNER_TEMP/published-crate.json"
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            http_code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --user-agent 'mach-release (https://github.com/Q1CHENL/mach)' \
              --output "$crate_json" \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/mach-tui/${CRATE_VERSION}")"
            if [ "$http_code" = 200 ]; then
              scripts/verify-release.sh crate \
                "$CRATE_ARCHIVE" "$CRATE_VERSION" "$crate_json"
              exit 0
            fi
            if [ "$http_code" != 404 ]; then
              printf 'crates.io verification returned HTTP %s\n' \
                "$http_code" >&2
              cat "$crate_json" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          printf 'crates.io did not publish mach-tui %s within 60 seconds\n' \
            "$CRATE_VERSION" >&2
          exit 1

      - name: Publish the checksum-verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/release-before-publish.json"
          if jq -e '.draft == true' \
            "$RUNNER_TEMP/release-before-publish.json" >/dev/null; then
            scripts/verify-release.sh github \
              dist "$RUNNER_TEMP/release-before-publish.json" "$NOTES_FILE" \
              "${{ needs.verify.outputs.version }}"
          else
            scripts/verify-release.sh github-published \
              dist "$RUNNER_TEMP/release-before-publish.json" "$NOTES_FILE" \
              "${{ needs.verify.outputs.version }}"
          fi

          gh release edit "$TAG_NAME" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/release-after-publish.json"
          scripts/verify-release.sh github-published \
            dist "$RUNNER_TEMP/release-after-publish.json" "$NOTES_FILE" \
            "${{ needs.verify.outputs.version }}"
          latest_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')"
          if ! jq -e \
            --arg tag "$TAG_NAME" \
            '.draft == false and .prerelease == false and .tag_name == $tag' \
            "$RUNNER_TEMP/release-after-publish.json" >/dev/null \
            || [ "$latest_tag" != "$TAG_NAME" ]; then
            printf 'release %s was not published as latest\n' "$TAG_NAME" >&2
            exit 1
          fi
