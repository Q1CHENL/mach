[package]
name = "mach-tui"
version = "0.10.0"
edition = "2024"
rust-version = "1.90"
description = "A terminal-first task manager for people who live in the shell and work with agents"
authors = ["Qichen Liu"]
license = "MIT"
keywords = ["tui", "todo", "terminal", "productivity", "task-management"]
categories = ["command-line-utilities"]
readme = "README.md"
repository = "https://github.com/Q1CHENL/mach"
include = [
    "src/**",
    "tests/**",
    "assets/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

# The crate is `mach-tui` on crates.io (`mach` is taken by the Mach kernel
# bindings), but the library and the binary are plain `mach`.
[lib]
name = "mach"
path = "src/lib.rs"

[[bin]]
name = "mach"
path = "src/bin/mach.rs"

[dependencies]
arboard = { version = "3.6.1", features = ["image-data"] }
base64 = "0.22"
caseless = "0.2.2"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.1.9"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# image → zune-jpeg: empty warn! stubs break release builds unless `log` is on.
zune-jpeg = { version = "0.5.15", features = ["log"] }
ratatui = "0.30.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled", "limits"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tar = { version = "0.4.46", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "3"
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
